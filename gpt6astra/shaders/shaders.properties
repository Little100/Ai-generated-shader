# Tidelume 0.1.2 / 汀光 — original Iris shaderpack for Minecraft Java 1.21.11.
# API-only references are documented in docs/API_REFERENCES.md.
oldLighting=false
separateAo=false
clouds=off
sun=false
moon=false
stars=false
vignette=false
underwaterOverlay=false
rain.depth=false
beacon.beam.depth=true
shadow.culling=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true
particles.ordering=mixed
separateEntityDraws=true
iris.features.required=ENTITY_TRANSLUCENT PER_BUFFER_BLENDING
iris.features.optional=FADE_VARIABLE

# Render targets in a pass have identical sizes; full-screen passes use normalized UVs.
size.buffer.colortex5=0.5 0.5
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.5 0.5

# Shadow tint is straight, unblended transmission data.
blend.shadow=off
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Crack overlay is multiplicative, and must not overwrite the normal target.
blend.gbuffers_damagedblock=DST_COLOR ZERO ZERO ONE
# No cloud geometry; the procedural sky is rendered once in deferred.
program.gbuffers_clouds.enabled=false
program.world0/gbuffers_clouds.enabled=false
program.world-1/gbuffers_clouds.enabled=false
program.world1/gbuffers_clouds.enabled=false
program.shadow.enabled=SHADOWS
program.world0/shadow.enabled=SHADOWS
program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false

profile.LOW=SHADOWS shadowMapResolution:1024 shadowDistance:64.0 SHADOW_SAMPLES:4 !COLORED_SHADOWS !AMBIENT_OCCLUSION CLOUDS CLOUD_STEPS:4 !VOLUMETRIC_LIGHT !WATER_REFLECTIONS !WET_SURFACES BLOOM WIND EDGE_AA
profile.BALANCED=SHADOWS shadowMapResolution:2048 shadowDistance:128.0 SHADOW_SAMPLES:12 COLORED_SHADOWS AMBIENT_OCCLUSION CLOUDS CLOUD_STEPS:8 VOLUMETRIC_LIGHT VOLUMETRIC_STEPS:12 WATER_REFLECTIONS SSR_STEPS:20 WET_SURFACES BLOOM WIND EDGE_AA
profile.HIGH=SHADOWS shadowMapResolution:3072 shadowDistance:160.0 SHADOW_SAMPLES:20 COLORED_SHADOWS AMBIENT_OCCLUSION CLOUDS CLOUD_STEPS:12 VOLUMETRIC_LIGHT VOLUMETRIC_STEPS:18 WATER_REFLECTIONS SSR_STEPS:28 WET_SURFACES BLOOM WIND EDGE_AA

screen=<profile> <empty> [LIGHTING] [ATMOSPHERE] [WATER] [MATERIALS] [POST] [INFO]
screen.columns=2
screen.LIGHTING=SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS COLORED_SHADOWS AMBIENT_OCCLUSION AO_STRENGTH SUN_BRIGHTNESS NIGHT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS HAND_LIGHT
screen.ATMOSPHERE=CLOUDS CLOUD_COVERAGE CLOUD_STEPS CLOUD_HEIGHT VOLUMETRIC_LIGHT VOLUMETRIC_STEPS FOG_DENSITY STARS END_HALO
screen.WATER=WATER_REFLECTIONS SSR_STEPS WATER_WAVE_STRENGTH WATER_CLARITY WATER_REFRACTION
screen.MATERIALS=WIND WIND_STRENGTH WET_SURFACES
screen.POST=BLOOM BLOOM_STRENGTH EXPOSURE SATURATION EDGE_AA VIGNETTE_STRENGTH
screen.INFO=<empty>
sliders=SHADOW_SOFTNESS AO_STRENGTH SUN_BRIGHTNESS NIGHT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS CLOUD_COVERAGE FOG_DENSITY WATER_WAVE_STRENGTH WATER_CLARITY WATER_REFRACTION WIND_STRENGTH BLOOM_STRENGTH EXPOSURE SATURATION VIGNETTE_STRENGTH

# Data targets are never alpha blended, including the hand classification flag.
blend.gbuffers_basic.colortex1=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_hand.colortex1=off
