# ==============================================================================
# Aetheria: Celestial Dreams (以太之境)
# Iris Shaderpack Configuration for Minecraft 1.21+
# ==============================================================================

# Buffer Formats (HDR High Dynamic Range)
colortex0.format=RGBA16F
colortex1.format=RGBA16F
colortex2.format=RGBA16F
colortex3.format=RGBA16F

# Shadow Configuration
shadowMapResolution=2048
shadowDistance=128.0
shadowIntervalSize=2.0
shadowHardwareFiltering=true

# Main Options Screen Organization
screen = [LIGHTING] [ATMOSPHERE] [WATER] [WIND] [CINEMATIC]

# Lighting Settings
screen.LIGHTING = SHADOW_QUALITY SHADOW_SAMPLES TORCH_FLICKER SUBSURFACE_SCATTERING AMBIENT_BRIGHTNESS

# Atmosphere & Celestial Sky Settings
screen.ATMOSPHERE = ATMOSPHERIC_FOG CELESTIAL_NEBULA VIBRANT_SUNSET TWINKLING_STARS FOG_DENSITY

# Water Dynamics Settings
screen.WATER = WATER_WAVES WATER_CAUSTICS WATER_CLARITY WATER_REFLECTIONS

# Wind & Vegetation Motion Settings
screen.WIND = WAVING_GRASS WAVING_LEAVES WIND_SPEED WIND_STRENGTH

# Post-processing & Cinematic Lens
screen.CINEMATIC = BLOOM_QUALITY TONE_MAPPING VIGNETTE CHROMATIC_ABERRATION SATURATION

# Slider assignments
sliders = FOG_DENSITY AMBIENT_BRIGHTNESS SATURATION
