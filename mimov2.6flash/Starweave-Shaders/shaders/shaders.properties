# Starweave pipeline config (keep this file ASCII, Iris preprocessor parses it strictly)

clouds=off
vignette=false
underwaterOverlay=false
sun=true
moon=true
oldLighting=false
oldHandLight=false
dynamicHandLight=true
separateAo=true
frustum.culling=true
rain.depth=true

shadowTerrain=true
shadowEntities=true
shadowBlockEntities=true
shadowTranslucent=false
shadow.culling=back

particles.ordering=mixed

program.shadow.enabled=SHADOWS
program.composite.enabled=BLOOM
program.composite1.enabled=BLOOM
program.composite2.enabled=BLOOM

sliders=SHADOW_RES VOLUMETRIC_STEPS BLOOM_STRENGTH EXPOSURE

screen=<profile> SHADOWS SSAO VOLUMETRICS CLOUD_SHADOWS BLOOM WAVING WATER_WAVES AURORA FXAA VIGNETTE [quality]
screen.quality=SHADOW_RES VOLUMETRIC_STEPS BLOOM_STRENGTH EXPOSURE
screen.columns=2

profile.Low=!SSAO !VOLUMETRICS !CLOUD_SHADOWS !FXAA !BLOOM SHADOWS WAVING WATER_WAVES AURORA VIGNETTE SHADOW_RES:1024 VOLUMETRIC_STEPS:8 BLOOM_STRENGTH:0.04 EXPOSURE:1.0
profile.Medium=SHADOWS SSAO !VOLUMETRICS !CLOUD_SHADOWS FXAA BLOOM WAVING WATER_WAVES AURORA VIGNETTE SHADOW_RES:2048 VOLUMETRIC_STEPS:12 BLOOM_STRENGTH:0.08 EXPOSURE:1.0
profile.High=SHADOWS SSAO VOLUMETRICS CLOUD_SHADOWS FXAA BLOOM WAVING WATER_WAVES AURORA VIGNETTE SHADOW_RES:2048 VOLUMETRIC_STEPS:16 BLOOM_STRENGTH:0.08 EXPOSURE:1.0
profile.Ultra=SHADOWS SSAO VOLUMETRICS CLOUD_SHADOWS FXAA BLOOM WAVING WATER_WAVES AURORA VIGNETTE SHADOW_RES:4096 VOLUMETRIC_STEPS:32 BLOOM_STRENGTH:0.14 EXPOSURE:1.0
