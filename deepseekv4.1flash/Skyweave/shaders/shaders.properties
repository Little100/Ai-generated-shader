# Skyweave
#
# Layout and buffer configuration live here; the options themselves are declared
# with #define in lib/config.glsl, which is where their value lists and tooltips
# come from.
#
# Note that screen, sliders and profile are read from this file before any
# preprocessing, so they cannot be wrapped in conditionals.

# ---------------------------------------------------------------- buffers

# bloom chain
size.buffer.colortex6 = 0.25 0.25
size.buffer.colortex7 = 0.25 0.25
size.buffer.colortex8 = 0.5 0.5

# exposure accumulators, one texel each
size.buffer.colortex9 = 1 1
size.buffer.colortex10 = 1 1

# ---------------------------------------------------------------- programs

# the depth of field pass only exists when the option is on
program.composite9.enabled = DEPTH_OF_FIELD

# a beacon beam glows on top of the frame instead of replacing it
blend.gbuffers_beaconbeam = SRC_ALPHA ONE ZERO ONE

# the water surface is data, not colour, so only the nearest fragment may write
blend.gbuffers_water = off
blend.gbuffers_hand_water = off

# ---------------------------------------------------------------- screens

screen = <empty> <empty> <profile> <empty> <empty> [SKY] [WATER] [LIGHTING] [WORLD] [POST] *

screen.SKY = SKY_ATMOSPHERE SKY_SUN SKY_MOON SKY_STARS SKY_GALAXY SKY_AURORA <empty> AURORA_STRENGTH AURORA_FREQUENCY <empty> SKY_QUALITY SUN_GLOW SKY_LIGHT_STRENGTH
screen.SKY.columns = 2

screen.WATER = WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_REFRACTION WATER_ABSORPTION WATER_SPECULAR
screen.WATER.columns = 2

screen.LIGHTING = <empty> SHADOW_DISTANCE SHADOW_FILTER SHADOW_SOFTNESS <empty> DIRECT_LIGHT_STRENGTH BLOCK_LIGHT_STRENGTH COLORED_LIGHTS COLORED_LIGHT_SATURATION <empty> SSAO_QUALITY SSAO_STRENGTH SPECULAR_STRENGTH SMOOTHNESS_BIAS <empty> VOLUMETRIC_QUALITY VOLUMETRIC_STRENGTH
screen.LIGHTING.columns = 2

screen.WORLD = FOG_STRENGTH FOG_HEIGHT FOG_DISTANCE RAIN_FOG_BOOST <empty> WET_SURFACES WET_SURFACE_STRENGTH <empty> WAVING_PLANTS WAVING_STRENGTH <empty> CLOUD_QUALITY
screen.WORLD.columns = 2

screen.POST = TONEMAP EXPOSURE AUTO_EXPOSURE AUTO_EXPOSURE_SPEED <empty> SATURATION CONTRAST <empty> BLOOM_STRENGTH <empty> DEPTH_OF_FIELD DOF_STRENGTH <empty> VIGNETTE SHARPEN GRAIN CHROMATIC_ABERRATION
screen.POST.columns = 2

# ---------------------------------------------------------------- sliders

sliders = SHADOW_SOFTNESS DIRECT_LIGHT_STRENGTH BLOCK_LIGHT_STRENGTH COLORED_LIGHT_SATURATION SSAO_STRENGTH VOLUMETRIC_STRENGTH SKY_QUALITY CLOUD_QUALITY BLOOM_STRENGTH SUN_GLOW SKY_LIGHT_STRENGTH AURORA_STRENGTH AURORA_FREQUENCY FOG_STRENGTH FOG_HEIGHT FOG_DISTANCE RAIN_FOG_BOOST SPECULAR_STRENGTH SMOOTHNESS_BIAS WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_REFRACTION WATER_ABSORPTION WATER_SPECULAR WET_SURFACE_STRENGTH WAVING_STRENGTH EXPOSURE AUTO_EXPOSURE_SPEED SATURATION CONTRAST DOF_STRENGTH VIGNETTE SHARPEN GRAIN CHROMATIC_ABERRATION

# ---------------------------------------------------------------- profiles

profile.POTATO = !SKY_GALAXY !SKY_AURORA !SKY_STARS !WET_SURFACES !AUTO_EXPOSURE !DEPTH_OF_FIELD !WAVING_PLANTS !COLORED_LIGHTS SHADOW_DISTANCE=0 SHADOW_FILTER=0 SSAO_QUALITY=0 VOLUMETRIC_QUALITY=0 SKY_QUALITY=1 CLOUD_QUALITY=0 BLOOM_STRENGTH=0.4 SHARPEN=0.0 GRAIN=0.0 VIGNETTE=0.0 CHROMATIC_ABERRATION=0.0

profile.LOW = profile.POTATO SKY_STARS SHADOW_DISTANCE=1 SSAO_QUALITY=1 VOLUMETRIC_QUALITY=1 SKY_QUALITY=1 CLOUD_QUALITY=1 BLOOM_STRENGTH=0.6 SHARPEN=0.25 GRAIN=0.1

profile.MEDIUM = profile.LOW !SKY_AURORA COLORED_LIGHTS WET_SURFACES WAVING_PLANTS SHADOW_DISTANCE=2 SHADOW_FILTER=1 SSAO_QUALITY=2 VOLUMETRIC_QUALITY=2 SKY_QUALITY=2 CLOUD_QUALITY=2 BLOOM_STRENGTH=0.85

profile.HIGH = profile.MEDIUM SKY_AURORA SKY_GALAXY SKY_MOON SKY_SUN SUN_GLOW=1.5 DEPTH_OF_FIELD DOF_STRENGTH=0.25 AUTO_EXPOSURE SHADOW_DISTANCE=2 SHADOW_FILTER=2 SSAO_QUALITY=3 VOLUMETRIC_QUALITY=3 SKY_QUALITY=3 CLOUD_QUALITY=3 BLOOM_STRENGTH=1.0

profile.ULTRA = profile.HIGH SHADOW_DISTANCE=3 SHADOW_SOFTNESS=1.5 FOG_STRENGTH=1.25
