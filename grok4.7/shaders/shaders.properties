variable.float.dayAngle = sunAngle * 2.0 * 3.14159265
uniform.vec3.K_SUN_DIR = vec3(sin(dayAngle), cos(dayAngle), 0.0)
variable.float.moonAngle = dayAngle + 3.14159265
uniform.vec3.K_MOON_DIR = vec3(sin(moonAngle), cos(moonAngle), 0.0)
uniform.float.K_SUN_UP = clamp(K_SUN_DIR.y * 4.0 + 0.15, 0.0, 1.0)
uniform.float.K_NIGHT = 1.0 - K_SUN_UP
uniform.float.K_TWILIGHT = if(K_SUN_DIR.y < 0.18 && K_SUN_DIR.y > -0.12, 1.0 - abs(K_SUN_DIR.y) * 4.0, 0.0)
uniform.float.K_MOON_LIGHT = if(moonPhase == 0, 1.0, moonPhase == 4, 0.15, moonPhase == 1 || moonPhase == 7, 0.8, moonPhase == 3 || moonPhase == 5, 0.4, 0.6)
uniform.vec3.K_LIGHT_DIR = if(K_SUN_DIR.y > 0.0, K_SUN_DIR, K_MOON_DIR)
uniform.float.K_TIME = frameTimeCounter
uniform.float.K_DAY_PHASE = sunAngle
uniform.float.K_CLOUD_COVER = clamp(0.25 + rainStrength * 0.65 + wetness * 0.15, 0.0, 1.0)
uniform.float.K_EXPOSURE = 1.0

screen = <empty> <profile> <empty> [LOOK] [LIGHT] [WORLD] [IMAGE]
screen.columns = 3
screen.LOOK = K_GRADE K_SATURATION K_VIGNETTE K_EXPOSURE_BIAS
screen.LIGHT = K_SUN_INTENSITY K_MOON_INTENSITY K_TORCH_INTENSITY K_SHADOW_RES K_SHADOW_DIST K_AO K_SSGI
screen.WORLD = K_VOLUMETRIC K_SSR K_WATER_WAVES K_CLOUD K_QUALITY
screen.IMAGE = K_BLOOM K_TA
