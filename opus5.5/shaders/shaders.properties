# 选项分组与预设

screen = [LIGHTING] [ATMOSPHERE] [WATER] [POST] [PERFORMANCE] <empty> <profile>
screen.LIGHTING = DAPPLED_LIGHT dappleScale dappleDepth shadowSoftness shadowDistance CLOUD_SHADOW
screen.ATMOSPHERE = SP_SKY SP_CLOUDS cloudCoverage cloudAltitude cloudThickness VOLUMETRIC_FOG fogDensity fogHeightFalloff GOD_RAYS godrayStrength
screen.WATER = WATER_WAVES waveHeight WATER_REFLECTION fresnelBias causticsStrength wetHighlight
screen.POST = BLOOM bloomStrength exposure colSat TONEMAP_ACES SSAO aoStrength aoRadius
screen.PERFORMANCE = shadowMapResolution shadowSamples godraySteps cloudSteps renderScale DIM_NETHER DIM_END
screen.columns = 2

sliders = dappleScale dappleDepth shadowSoftness shadowDistance cloudCoverage cloudAltitude cloudThickness fogDensity fogHeightFalloff godrayStrength waveHeight fresnelBias causticsStrength wetHighlight bloomStrength exposure colSat aoStrength aoRadius renderScale

profile.LOW = !DAPPLED_LIGHT !CLOUD_SHADOW !SP_CLOUDS !VOLUMETRIC_FOG !GOD_RAYS !WATER_REFLECTION !BLOOM !SSAO shadowMapResolution=1024 shadowSamples=4 cloudSteps=12 renderScale=0.75
profile.MEDIUM = DAPPLED_LIGHT CLOUD_SHADOW SP_CLOUDS VOLUMETRIC_FOG GOD_RAYS WATER_REFLECTION BLOOM SSAO shadowMapResolution=2048 shadowSamples=12 cloudSteps=24 godraySteps=16 renderScale=1.0
profile.HIGH = DAPPLED_LIGHT CLOUD_SHADOW SP_CLOUDS VOLUMETRIC_FOG GOD_RAYS WATER_REFLECTION BLOOM SSAO shadowMapResolution=3072 shadowSamples=20 cloudSteps=36 godraySteps=40 renderScale=1.0

# 全局设定
iris.features.required = COMPUTE_SHADERS
iris.features.optional = CUSTOM_IMAGES

shadow.culling = reversed
shadow.enabled = true
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true

clouds = false
sun = true
moon = true
sky = false
stars = false
vignette = false
underwaterOverlay = false
weather = true
oldLighting = false
separateAo = false

# 缓冲区尺寸
size.buffer.colortex5 = 0.5 0.5
size.buffer.colortex6 = 0.5 0.5
