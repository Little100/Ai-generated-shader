# Ambergale shader pack configuration

iris.features.required=PER_BUFFER_BLENDING
iris.features.optional=ENTITY_TRANSLUCENT

clouds=off
sun=false
moon=false
vignette=false
underwaterOverlay=false
separateAo=true
oldLighting=false
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
particles.ordering=mixed
frustum.culling=true
shadow.culling=true

# Translucents write premultiplied color into colortex4 and unblended data into colortex3
blend.gbuffers_water.colortex4=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex3=off
blend.gbuffers_hand_water.colortex4=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex3=off
blend.gbuffers_entities_translucent.colortex4=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex3=off
blend.gbuffers_particles_translucent.colortex4=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex3=off
blend.gbuffers_block_translucent.colortex4=ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex3=off

blend.gbuffers_terrain=off
blend.gbuffers_block=off
blend.gbuffers_entities=off
blend.gbuffers_hand=off
blend.gbuffers_skybasic=off
blend.gbuffers_damagedblock=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_armor_glint=SRC_ALPHA ONE ONE ZERO
blend.gbuffers_beaconbeam=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO

alphaTest.gbuffers_terrain=GREATER 0.1
alphaTest.gbuffers_block=GREATER 0.1
alphaTest.gbuffers_entities=GREATER 0.1
alphaTest.gbuffers_hand=GREATER 0.1

sliders=SUN_INTENSITY SKY_AMBIENT BLOCKLIGHT_INTENSITY BLOCKLIGHT_WARMTH WIND_STRENGTH SHADOW_SOFTNESS shadowDistance shadowMapResolution sunPathRotation CLOUD_COVERAGE GODRAYS_STRENGTH FOG_DENSITY WATER_WAVE_HEIGHT WATER_CLARITY BLOOM_STRENGTH EXPOSURE CONTRAST SATURATION GRAIN_STRENGTH

screen=<profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [WATER] [POST]
screen.LIGHTING=SUN_INTENSITY SKY_AMBIENT BLOCKLIGHT_INTENSITY BLOCKLIGHT_WARMTH EMBER_FLICKER HAND_LIGHT WIND_STRENGTH
screen.SHADOWS=SHADOW_QUALITY SHADOW_SOFTNESS shadowMapResolution shadowDistance sunPathRotation
screen.ATMOSPHERE=CLOUDS CLOUD_COVERAGE STARS GODRAYS GODRAYS_STRENGTH FOG_DENSITY
screen.WATER=WATER_WAVE_HEIGHT WATER_REFRACTION WATER_CLARITY
screen.POST=BLOOM BLOOM_STRENGTH EXPOSURE CONTRAST SATURATION VIGNETTE FILM_GRAIN GRAIN_STRENGTH

profile.LOW=SHADOW_QUALITY=0 shadowMapResolution=1024 shadowDistance=96.0 !GODRAYS !BLOOM !CLOUDS !FILM_GRAIN
profile.MEDIUM=SHADOW_QUALITY=1 shadowMapResolution=2048 shadowDistance=160.0 GODRAYS BLOOM CLOUDS FILM_GRAIN
profile.HIGH=SHADOW_QUALITY=2 shadowMapResolution=4096 shadowDistance=192.0 GODRAYS BLOOM CLOUDS FILM_GRAIN
